<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANE.ZONE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #f0ede8;
      --accent: #4FC3F7;
      --accent-dim: rgba(79,195,247,0.18);
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Schibsted Grotesk', sans-serif;
    }

    html, body { height: 100%; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(240,237,232,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240,237,232,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .rule-v {
      position: fixed;
      top: 0;
      right: 120px;
      width: 1px;
      height: 100vh;
      background: rgba(240,237,232,0.04);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    header {
      padding-top: 48px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(240,237,232,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .icon-mark {
      opacity: 0.5;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 0 60px;
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(240,237,232,0.35);
      margin-bottom: 28px;
    }

    h1 {
      font-family: var(--sans);
      font-size: clamp(42px, 8vw, 88px);
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 36px;
      color: var(--white);
    }

    h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .descriptor {
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.65;
      color: rgba(240,237,232,0.5);
      max-width: 400px;
      margin-bottom: 56px;
      border-left: 1px solid rgba(79,195,247,0.35);
      padding-left: 16px;
    }

    .form-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(240,237,232,0.3);
      margin-bottom: 12px;
      display: block;
    }

    .form-row {
      display: flex;
      max-width: 480px;
    }

    .form-row input[type="email"] {
      flex: 1;
      background: transparent;
      border: 1px solid rgba(240,237,232,0.15);
      border-right: none;
      color: var(--white);
      font-family: var(--mono);
      font-size: 13px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 0;
    }

    .form-row input[type="email"]::placeholder {
      color: rgba(240,237,232,0.18);
    }

    .form-row input[type="email"]:focus {
      border-color: rgba(79,195,247,0.6);
    }

    .form-row button[type="submit"] {
      background: var(--accent);
      color: #f0ede8;
      border: 1px solid var(--accent);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 14px 20px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
      border-radius: 0;
    }

    .form-row button[type="submit"]:hover {
      background: transparent;
      color: var(--accent);
    }

    .status-msg {
      font-family: var(--mono);
      font-size: 12px;
      margin-top: 12px;
      min-height: 18px;
      color: rgba(79,195,247,0.8);
      letter-spacing: 0.05em;
    }

    .status-msg.error {
      color: rgba(220,80,80,0.8);
    }

    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid rgba(240,237,232,0.07);
      padding: 20px 32px;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer span {
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(240,237,232,0.18);
      letter-spacing: 0.1em;
    }

    @media (max-width: 540px) {
      .container { padding: 0 20px; }
      footer { padding: 20px; }
      .rule-v { display: none; }
      .form-row { flex-direction: column; }
      .form-row input[type="email"] {
        border-right: 1px solid rgba(240,237,232,0.15);
        border-bottom: none;
      }
      .form-row input[type="email"]:focus { border-color: rgba(79,195,247,0.6); }
      .form-row button[type="submit"] { padding: 14px; }
    }
  </style>
</head>
<body>

  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="rule-v" aria-hidden="true"></div>

  <div class="container">
    <header>
      <span class="wordmark">DANE.ZONE</span>
      <!-- Verb icon: 3 stacked squares offset up-right, matching HISE paint geometry -->
      <svg class="icon-mark" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- k=0: base square, centered -->
        <rect x="5" y="11" width="12" height="12" stroke="#4FC3F7" stroke-width="1.2" fill="none"/>
        <!-- k=1: offset +3x, -3y -->
        <rect x="8" y="8"  width="12" height="12" stroke="#4FC3F7" stroke-width="1.2" fill="none"/>
        <!-- k=2: offset +6x, -6y -->
        <rect x="11" y="5" width="12" height="12" stroke="#4FC3F7" stroke-width="1.2" fill="none"/>
      </svg>
    </header>

    <main>
      <p class="eyebrow">New store incoming</p>
      <h1>Something<br><em>new</em><br>is loading.</h1>
      <p class="descriptor">
        Redesigned plugins, new tools, and music from the studio of dane.zone.<br>
        Leave your email and you'll be first to know when the new store goes live.
      </p>

      <form id="subscribe-form" action="https://buttondown.com/api/emails/embed-subscribe/dane.zone" method="post">
        <label class="form-label" for="bd-email">Notify me when it's live</label>
        <div class="form-row">
          <input type="email" id="bd-email" name="email" placeholder="your@email.com" required autocomplete="email">
          <input type="hidden" value="1" name="embed">
          <button type="submit">Notify me</button>
        </div>
        <p class="status-msg" id="status-msg" aria-live="polite"></p>
      </form>
    </main>
  </div>

  <footer>
    <span>© 2026 DANE.ZONE</span>
    <span>Los Angeles, CA</span>
  </footer>
